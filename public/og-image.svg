<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1614"/>
      <stop offset="100%" stop-color="#211A17"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65 0.68" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="soft-light" result="blended"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grain -->
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.04"/>

  <!-- Ember accent bar left -->
  <rect x="80" y="80" width="3" height="470" fill="#E85D3A" opacity="0.6"/>

  <!-- Top kicker -->
  <text x="104" y="118" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="13" letter-spacing="3" fill="#E85D3A" text-transform="uppercase" opacity="0.9">STRATEGY CONSULTING · MSBAIM PURDUE '27</text>

  <!-- Main name -->
  <text x="104" y="270" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="96" fill="#F0EAE4" letter-spacing="-2">Kunal</text>
  <text x="104" y="370" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="96" fill="#F0EAE4" letter-spacing="-2">Kashyap</text>

  <!-- Accent word -->
  <text x="104" y="430" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="32" fill="#E85D3A">Strategy lives in the nuance.</text>

  <!-- Divider -->
  <line x1="104" y1="480" x2="480" y2="480" stroke="rgba(240,234,228,0.12)" stroke-width="1"/>

  <!-- Bottom details -->
  <text x="104" y="510" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#9A8E87">EN · हिं · 日 · తె</text>
  <text x="104" y="538" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#9A8E87">kunalvkashyap.com</text>

  <!-- Right side ambient ember glow -->
  <ellipse cx="980" cy="315" rx="320" ry="220" fill="#E85D3A" opacity="0.04"/>
  <ellipse cx="1050" cy="280" rx="180" ry="120" fill="#E85D3A" opacity="0.05"/>

  <!-- Right side: three accent lines (cross-cultural visual) -->
  <text x="820" y="240" font-family="Georgia, serif" font-style="italic" font-size="28" fill="rgba(240,234,228,0.15)" text-anchor="middle">United States</text>
  <text x="820" y="310" font-family="Georgia, serif" font-style="italic" font-size="28" fill="rgba(43,168,143,0.25)" text-anchor="middle">India</text>
  <text x="820" y="380" font-family="Georgia, serif" font-style="italic" font-size="28" fill="rgba(201,169,110,0.25)" text-anchor="middle">Japan</text>
</svg>
